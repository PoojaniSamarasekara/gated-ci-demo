name: CI

# This is the gate. Branch protection (set up in GitHub's UI, see README)
# requires this workflow's "test" job to pass before a PR into dev,
# staging, or main can be merged.
on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Pulled from GitHub Secrets, never from a committed file.
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, needed for the secret-scan step

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (the actual gate)
        run: python -m pytest -v

      - name: Prove the secret is usable but not leaked
        run: |
          if [ -z "$ADMIN_API_KEY" ]; then
            echo "ADMIN_API_KEY is not set" >&2
            exit 1
          fi
          echo "ADMIN_API_KEY is present, length: ${#ADMIN_API_KEY} characters"
          echo "Value itself is intentionally never echoed."
          echo "GitHub also auto-masks the raw secret value as *** if it ever appears in a log line."

      - name: Scan repo history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
